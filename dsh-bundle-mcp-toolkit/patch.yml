# MCP toolkit bundle. Each MCP server is an external stdio process whose tools
# are exposed as mcp__<serverName>__<tool>. codegraph answers queries for ANY
# project that has a .codegraph/ index via its per-call `projectPath`.
#
# CodeGraph is a plain configuration row: it needs no credentials, so the loader
# may start it at any point.
#
# Context7 is deliberately NOT a row in this file. Its client config carries a
# ${credential:CONTEXT7_API_KEY} transport template, and dsh-mcp-client rejects
# such a row at load unless a credentials provider is already ACTIVE
# (`ctx.get('credentials')` is strict). A static row starts together with every
# other loader entry — inside the window where dsh-credentials-local has
# provided `credentials` but has not finished its asynchronous initialisation —
# so it fails on every Host start, and a failed activation is never retried.
# The bundle's Host plugin (`context7-auth`) injects `credentials` and mounts
# that row itself once the provider is active; the config lives in
# lib/context7-mcp.js.
#
# No plaintext key lives in this package: until a key exists the mounted row
# stays in waiting-credentials, and storing the key reconnects it automatically.
#
# Versions are pinned so a launch never re-resolves "latest" over the network
# and an upstream release cannot break startup; bump them deliberately. The
# CodeGraph package is the scoped @colbymchenry/codegraph (the unscoped
# `codegraph` on npm is an unrelated package). Both servers use `npx -y`, so no
# global install is required.
- insert:
    - id: context7-auth
      name: '@wjm200509/dsh-bundle-mcp-toolkit'
    - id: mcp-codegraph
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: codegraph
        transport: stdio
        command: npx
        args: ['-y', '@colbymchenry/codegraph@1.6.2', 'serve', '--mcp']
        toolCallTimeoutMs: 120000
